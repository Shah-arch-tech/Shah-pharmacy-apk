name: Build Shah Pharmacy APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -o Shah_Pharmacy_Android.zip
          test -s Shah_Pharmacy_Android/app/src/main/assets/assets/logo-or-photo.jpg
          test -s Shah_Pharmacy_Android/app/src/main/assets/assets/pharmacy-photo.jpg
          test -s Shah_Pharmacy_Android/app/src/main/assets/assets/pharmacy-animation.mp4

      - name: Build Debug APK
        run: |
          gradle -p Shah_Pharmacy_Android assembleDebug --stacktrace
          APK=Shah_Pharmacy_Android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          echo "APK size: $(stat -c%s "$APK") bytes"
          test "$(stat -c%s "$APK")" -gt 500000

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Shah-Pharmacy-APK
          path: Shah_Pharmacy_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
