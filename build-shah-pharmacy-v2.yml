name: Build Shah Pharmacy APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -o Shah_Pharmacy_Android.zip
          cd Shah_Pharmacy_Android
          chmod +x gradlew
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.properties

      - name: Build APK
        run: |
          cd Shah_Pharmacy_Android
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK="Shah_Pharmacy_Android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          stat -c "APK size: %s bytes" "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shah-Pharmacy-APK
          path: Shah_Pharmacy_Android/app/build/outputs/apk/debug/app-debug.apk
